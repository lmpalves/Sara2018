<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amorim Sack Watch</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #DA291C 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            color: white;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 90%;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .status {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 1.5rem 0;
            text-transform: uppercase;
        }

        .answer {
            font-size: 5rem;
            font-weight: bold;
            margin: 2rem 0;
            animation: pulse 2s infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .time {
            font-size: 1.8rem;
            margin: 1rem 0;
            opacity: 0.9;
        }

        #timer {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ff9999;
            margin-top: 1rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .status { font-size: 2rem; }
            .answer { font-size: 4rem; }
            .time { font-size: 1.5rem; }
            #timer { font-size: 1.8rem; }
            .container { padding: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Amorim Sack Watch</h1>
        <div class="status">Has Amorim been Sacked?</div>
        <div class="answer">NO</div>
        <div class="time">Time since appointment:</div>
        <div id="timer" class="time">Loading...</div>
    </div>

    <script>
        const appointmentDate = new Date('2024-11-11T00:00:00Z');

        function updateTimer() {
            const now = new Date();
            const diff = now - appointmentDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('timer').textContent = 
                `${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds`;
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>

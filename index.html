<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amorim Sack Watch</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            background: linear-gradient(135deg, #c70101 0%, #ff0000 100%);
            color: white;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .status {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 1rem 0;
        }

        .time {
            font-size: 1.5rem;
            margin-top: 1rem;
        }

        .answer {
            font-size: 4rem;
            font-weight: bold;
            margin: 2rem 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Amorim Sack Watch</h1>
        <div class="status">Has Amorim been Sacked?</div>
        <div class="answer">NO</div>
        <div class="time">Time since appointment:</div>
        <div id="timer" class="time">Loading...</div>
    </div>

    <script>
        const appointmentDate = new Date('2024-11-11T00:00:00Z');

        function updateTimer() {
            const now = new Date();
            const diff = now - appointmentDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('timer').textContent = 
                `${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds`;
        }

        // Update timer immediately and then every second
        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
